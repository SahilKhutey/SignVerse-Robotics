version: '3.8'

services:
  # Infrastructure
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  # API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: services/base.Dockerfile
    command: uvicorn services.api-gateway.app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./services:/app/services
    depends_on:
      - redis
      - mongodb

  # Core Workers (Perception)
  perception-worker:
    build:
      context: .
      dockerfile: services/base.Dockerfile
    command: rq worker perception --url redis://redis:6379
    volumes:
      - ./services:/app/services
      - ./uploads:/app/uploads
    depends_on:
      - redis

volumes:
  mongo_data:
  qdrant_data:
