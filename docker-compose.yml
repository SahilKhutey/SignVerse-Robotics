version: '3.8'

services:
  # Infrastructure
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
  
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"

  # Core Services
  inference-service:
    build: ./services/inference-service
    ports:
      - "8000:8000"
    depends_on:
      - redis
      
  robotics-service:
    build: ./services/robotics-service
    ports:
      - "8001:8001"
    depends_on:
      - redis

  dataset-service:
    build: ./services/dataset-service
    ports:
      - "8002:8002"
    depends_on:
      - qdrant

  agent-service:
    build: ./services/agent-service
    ports:
      - "8003:8003"

  auth-service:
    build: ./services/auth-service
    ports:
      - "8004:8004"

  # Frontend
  dashboard:
    build: ./apps/dashboard-web
    ports:
      - "3000:3000"
