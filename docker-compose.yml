version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
# SignVerse Robotics — Local Development Stack
#
# Usage:
#   docker compose up            # start everything
#   docker compose up dashboard  # start only the frontend
#   docker compose logs -f       # follow all logs
#   docker compose down -v       # stop + wipe volumes
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ─── Node.js / Fastify API Gateway ────────────────────────────────────────
  fastapi-gateway:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: signverse_fastapi_gateway
    ports:
      - "8000:8000"
    environment:
      NODE_ENV: development
      PORT: "8000"
      HOST: "0.0.0.0"
      LOG_LEVEL: info
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: "http://localhost:5173"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    volumes:
      # Hot-reload in dev: mount source so ts-node picks up changes
      - ./backend/api-gateway/src:/app/backend/api-gateway/src:ro
      - ./packages:/app/packages:ro

  # ─── Vite Development Dashboard ───────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
      target: development
    container_name: signverse_dashboard_dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
    volumes:
      - ./apps/dashboard/src:/app/apps/dashboard/src
      - ./apps/dashboard/public:/app/apps/dashboard/public
      - ./packages:/app/packages:ro
      - ./package.json:/app/package.json:ro
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml:ro
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml:ro
      - ./tsconfig.base.json:/app/tsconfig.base.json:ro
    depends_on:
      fastapi-gateway:
        condition: service_healthy
    restart: unless-stopped

  # ─── Redis (Job Queue + Session Cache) ────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: signverse_redis_dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
