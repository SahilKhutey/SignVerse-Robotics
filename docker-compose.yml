version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: signverse_backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    # For GPU acceleration (optional, requires nvidia-docker)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: signverse_frontend
    ports:
      - "5173:80" # Mapping Vite's default dev port to Nginx container port
    depends_on:
      - backend
    environment:
      # Inject API URL for the compiled React App
      - VITE_API_URL=http://localhost:8000
