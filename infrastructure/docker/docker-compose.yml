version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: signverse_backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: signverse_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000

  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: signverse_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: signverse
      POSTGRES_PASSWORD: password
      POSTGRES_DB: signverse_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: signverse_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: signverse_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # ─── Observability Stack (PLG: Prometheus + Loki + Grafana) ──────────────────

  prometheus:
    image: prom/prometheus:latest
    container_name: signverse_prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro

  loki:
    image: grafana/loki:2.9.0
    container_name: signverse_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki

  promtail:
    image: grafana/promtail:2.9.0
    container_name: signverse_promtail
    volumes:
      - /var/log:/var/log:ro
      - ./observability/promtail.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: signverse_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=signverse_admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki

  # ─── Event Bus ───────────────────────────────────────────────────────────────

  nats:
    image: nats:alpine
    container_name: signverse_nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js"]

  # ─── Edge Robotics (MQTT) ────────────────────────────────────────────────────

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: signverse_mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  prometheus_data:
  loki_data:
  grafana_data:
  mosquitto_data:
  mosquitto_log:
