global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "signverse_api_gateway"
    static_configs:
      - targets: ["backend:3000"]
    metrics_path: /metrics

  - job_name: "signverse_auth_service"
    static_configs:
      - targets: ["auth-service:3001"]
    metrics_path: /metrics

  - job_name: "signverse_telemetry"
    static_configs:
      - targets: ["telemetry-service:3002"]
    metrics_path: /metrics

  - job_name: "signverse_ai_service"
    static_configs:
      - targets: ["ai-service:3003"]
    metrics_path: /metrics

  - job_name: "nats"
    static_configs:
      - targets: ["nats:8222"]
    metrics_path: /metrics
